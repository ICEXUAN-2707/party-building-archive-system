name: CI
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check repository policy
        run: python scripts/ci_guard.py
  django-tests:
    name: Django tests (${{ matrix.os }})
    needs:
      - repository-policy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout tested merge result
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure temporary SQLite database
        shell: python
        run: |
          import os
          from pathlib import Path
          database_path = Path(os.environ["RUNNER_TEMP"]) / "ci.sqlite3"
          github_env = Path(os.environ["GITHUB_ENV"])
          with github_env.open("a", encoding="utf-8") as env_file:
              env_file.write(f"DJANGO_SQLITE_PATH={database_path}\n")
          print("Temporary SQLite database configured in RUNNER_TEMP.")
      - name: Verify CI environment
        shell: python
        run: |
          import os
          from pathlib import Path
          database_path = Path(os.environ["DJANGO_SQLITE_PATH"])
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          if database_path.parent != runner_temp:
              raise SystemExit("SQLite database is not located in RUNNER_TEMP.")
          if database_path.name != "ci.sqlite3":
              raise SystemExit("Unexpected CI database filename.")
          print("CI environment verification passed.")
      - name: Show tool versions
        run: |
          python --version
          python -m pip --version
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      # 新增：将仓库根目录加入PYTHONPATH，修复apps包导入失败
      - name: Set PYTHONPATH workspace root
        run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
      - name: Run Django system checks
        run: python manage.py check
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations to an empty temporary database
        run: python manage.py migrate --noinput
      - name: Run complete test suite
        run: python manage.py test -v 2
      - name: Check for test pollution
        if: ${{ !cancelled() }}
        run: python scripts/ci_guard.py --post-test