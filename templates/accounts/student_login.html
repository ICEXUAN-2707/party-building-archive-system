{% extends "base.html" %}

{% block title %}学生登录{% endblock %}

{% block content %}
<div class="page-panel">
  <h1 class="h3 mb-3">学生登录</h1>
  {% if form.non_field_errors %}
    <div class="alert alert-danger" role="alert">
      {% for error in form.non_field_errors %}{{ error }}{% endfor %}
    </div>
  {% endif %}
  <form class="row g-3" method="POST" action="{% url 'accounts:student_login' %}" novalidate>
    {% csrf_token %}
    <div class="col-md-6">
      <label class="form-label" for="{{ form.name.id_for_label }}">{{ form.name.label }}</label>
      {{ form.name }}
    </div>
    <div class="col-md-6">
      <label class="form-label" for="{{ form.student_number.id_for_label }}">{{ form.student_number.label }}</label>
      {{ form.student_number }}
    </div>
    <div class="col-12">
      <button class="btn btn-primary" type="submit">登录</button>
    </div>
  </form>
</div>
{% endblock %}
