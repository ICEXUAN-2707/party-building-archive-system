{% extends "base.html" %}

{% block title %}首页 - 学院学生材料信息查询系统{% endblock %}

{% block content %}
<section class="py-4 py-md-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-9 col-xl-8 text-center">
      <h1 class="display-6 fw-semibold mb-3">学院学生材料信息查询系统</h1>
      <p class="lead text-secondary mb-4">请选择对应身份登录系统。</p>
      <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
        <a class="btn btn-primary px-4" href="{% url 'accounts:student_login' %}">学生登录</a>
        <a class="btn btn-outline-primary px-4" href="{% url 'accounts:admin_login' %}">管理员登录</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
