name: party-archive

services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must reference a reviewed immutable release image}
    env_file:
      - ${PRODUCTION_ENV_FILE:-/srv/party-archive/secrets/.env.production}
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    expose:
      - "8000"
    volumes:
      - type: bind
        source: ${PARTY_ARCHIVE_ROOT:-/srv/party-archive}/data/database
        target: /data/database
        bind:
          create_host_path: false
      - type: bind
        source: ${PARTY_ARCHIVE_ROOT:-/srv/party-archive}/data/media
        target: /data/media
        bind:
          create_host_path: false
      - type: bind
        source: ${PARTY_ARCHIVE_ROOT:-/srv/party-archive}/data/static
        target: /data/static
        bind:
          create_host_path: false
      - type: bind
        source: ${PARTY_ARCHIVE_ROOT:-/srv/party-archive}/data/backups
        target: /data/backups
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client, os, sys; connection = http.client.HTTPConnection('127.0.0.1', 8000, timeout=3); connection.request('GET', '/health/ready/', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0], 'X-Forwarded-Proto': 'https'}); response = connection.getresponse(); sys.exit(0 if response.status == 200 and response.read() == b'ok\\n' else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.28.0-alpine}
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME must be the reviewed fixed public IPv4 address}
      NGINX_ENVSUBST_FILTER: ^NGINX_
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    init: true
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./deploy/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ./deploy/nginx/templates/party-archive.conf.template
        target: /etc/nginx/templates/party-archive.conf.template
        read_only: true
      - type: bind
        source: ${PARTY_ARCHIVE_ROOT:-/srv/party-archive}/data/static
        target: /srv/party-archive/static
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=8m,mode=0755
      - /tmp:size=16m,mode=1777
      - /etc/nginx/conf.d:size=8m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
      - backend
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

networks:
  frontend:
  backend:
    internal: true
